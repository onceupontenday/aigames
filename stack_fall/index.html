<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stack Fall</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#1a1a2e;
    display:flex;align-items:center;justify-content:center;
    height:100vh;overflow:hidden;
    font-family:'Segoe UI',sans-serif;
    touch-action:none;user-select:none
  }
  #hud{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 20px;color:#fff;font-size:16px;z-index:10;
  }
  #scoreEl{color:#ffd700;font-size:22px;font-weight:700}
  #bestEl{color:#a29bfe;font-size:16px}
  canvas{display:block}
  #overlay{
    position:fixed;inset:0;
    background:rgba(26,26,46,.93);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:20;color:#fff;
  }
  #overlay h1{
    font-size:44px;margin-bottom:6px;
    background:linear-gradient(135deg,#ffd700,#ff6b6b);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  #overlay p{color:#aaa;font-size:15px;margin-bottom:28px;text-align:center;max-width:280px;line-height:1.6}
  .btn{
    padding:13px 38px;border:none;border-radius:40px;
    font-size:17px;font-weight:700;cursor:pointer;
    transition:transform .15s;margin:6px;
  }
  .btn:active{transform:scale(.94)}
  .btn-primary{
    background:linear-gradient(135deg,#ffd700,#ff9500);color:#1a1a2e;
    box-shadow:0 4px 20px rgba(255,215,0,.4);
  }
  .score-pop{
    position:fixed;pointer-events:none;
    font-size:22px;font-weight:900;
    color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.9);
    animation:sp .7s ease-out forwards;z-index:30;
  }
  @keyframes sp{
    0%{transform:translateY(0) scale(1);opacity:1}
    100%{transform:translateY(-70px) scale(1.5);opacity:0}
  }
</style>
</head>
<body>
<div id="hud">
  <div>🏆 <span id="scoreEl">0</span></div>
  <div>⭐ <span id="bestEl">0</span></div>
</div>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>🏗️ Stack Fall</h1>
  <p>滑动或方向键控制方块落下方向<br>精准叠放得分！</p>
  <button class="btn btn-primary" id="startBtn">开始游戏</button>
</div>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('scoreEl');
  const bestEl = document.getElementById('bestEl');

  let W, H, CELL;
  let running = false, gameOver = false;
  let score = 0;
  let gravity = { x:0, y:1 };
  let blocks = []; // placed blocks: {col, color, x, y, size}
  let current = null; // falling block
  let particles = []; // {x, y, vx, vy, color, life, r}
  let combo = 0;
  let COLS = 5;
  // camera: tracks how much we've scrolled up (world Y decreases as stack grows)
  let camY = 0;
  let targetCamY = 0;
  let level = 1, diffTimer = 0;

  const PAL = [
    '#ff6b6b','#ffd700','#4ecdc4','#a29bfe','#fd79a8',
    '#00cec9','#e17055','#74b9ff','#55efc4','#fab1a0'
  ];

  function resize(){
    W = canvas.width = Math.min(window.innerWidth, 500);
    H = canvas.height = window.innerHeight;
    CELL = W / COLS;
  }
  window.addEventListener('resize', resize);
  resize();

  function rndCol(){ return PAL[Math.floor(Math.random()*PAL.length)]; }

  // ── World coordinate system ──
  // World Y=0 = top of canvas (screen top)
  // World Y increases DOWNWARD
  // Floor surface: world Y = H - CELL
  // Column center x: col*CELL + CELL/2

  function spawnBlock(){
    const col = Math.floor(Math.random() * COLS);
    current = {
      col,
      color: rndCol(),
      x: col * CELL + CELL/2,
      y: camY - CELL * 0.5,  // spawn above visible area
      vx: 0, vy: 0,
      size: CELL * 0.9,
      settled: false,
      age: 0
    };
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function drawBg(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a1a2e'); g.addColorStop(1,'#16213e');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    ctx.lineWidth = 1;
    for(let i=0;i<=COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,H); ctx.stroke();
    }
  }

  function drawFloor(){
    // Floor: a row at bottom of visible area, world Y = H-CELL
    const floorSy = (H - CELL) - camY;
    if(floorSy > H+10 || floorSy+CELL < -10) return;
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(0, floorSy, W, CELL);
    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,floorSy); ctx.lineTo(W,floorSy); ctx.stroke();
  }

  function drawBlock(b){
    // b.y is world Y center, convert to screen Y
    const sy = b.y - b.size/2 - camY;
    if(sy > H+10 || sy+b.size < -10) return;
    const sx = b.x - b.size/2;

    ctx.fillStyle = 'rgba(0,0,0,.3)';
    roundRect(sx+3, sy+3, b.size, b.size, 6); ctx.fill();

    ctx.fillStyle = b.color;
    roundRect(sx, sy, b.size, b.size, 6); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.3)';
    roundRect(sx+4, sy+4, b.size*.4, b.size*.25, 3); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.2)';
    ctx.lineWidth = 1.5;
    roundRect(sx, sy, b.size, b.size, 6); ctx.stroke();
  }

  function drawCurrent(){
    if(!current) return;
    const b = current;
    const sx = b.x - b.size/2;
    const sy = b.y - b.size/2 - camY;

    ctx.save();
    ctx.shadowColor = b.color; ctx.shadowBlur = 18;
    ctx.fillStyle = b.color;
    roundRect(sx, sy, b.size, b.size, 6); ctx.fill();
    ctx.restore();

    ctx.fillStyle = b.color;
    roundRect(sx, sy, b.size, b.size, 6); ctx.fill();

    const pulse = .5 + .5*Math.sin(Date.now()/150);
    ctx.fillStyle = 'rgba(255,255,255,'+(.15+pulse*.2)+')';
    roundRect(sx+6, sy+6, b.size-12, b.size-12, 4); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.35)';
    roundRect(sx+4, sy+4, b.size*.4, b.size*.25, 3); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 2;
    roundRect(sx, sy, b.size, b.size, 6); ctx.stroke();
  }

  function drawParticles(){
    for(const p of particles){
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y - camY, p.r * p.life, 0, Math.PI*2);
      ctx.fill(); ctx.restore();
    }
  }

  function drawArrow(){
    const cx = W/2, cy = 55, len = 20;
    const gx=gravity.x, gy=gravity.y;
    const gl=Math.sqrt(gx*gx+gy*gy);
    if(gl===0) return;
    const nx=gx/gl, ny=gy/gl;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx-nx*len, cy-ny*len);
    ctx.lineTo(cx+nx*len, cy+ny*len); ctx.stroke();
    const a = Math.atan2(ny,nx);
    ctx.beginPath();
    ctx.moveTo(cx+nx*len, cy+ny*len);
    ctx.lineTo(cx+nx*len-8*Math.cos(a-.5), cy+ny*len-8*Math.sin(a-.5));
    ctx.lineTo(cx+nx*len-8*Math.cos(a+.5), cy+ny*len-8*Math.sin(a+.5));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function spawnParticles(x, y, color, n){
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 1+Math.random()*3;
      particles.push({x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-2, color, life:1, r:3+Math.random()*4});
    }
  }

  function popScore(x, y, pts, isCombo){
    const el = document.createElement('div');
    el.className = 'score-pop';
    el.textContent = isCombo ? pts+' COMBO!' : '+'+pts;
    el.style.left = Math.min(Math.max(x-30,10),W-60)+'px';
    el.style.top  = Math.min(Math.max(y-40,10),H-40)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 750);
  }

  function applyGravity(){
    if(!current || current.settled) return;
    const gx=gravity.x, gy=gravity.y;
    const gl=Math.sqrt(gx*gx+gy*gy);
    if(gl===0) return;
    const nx=gx/gl, ny=gy/gl;
    const str = 3.5 + level*.3;

    current.vx += nx*str*.08;
    current.vy += ny*str*.08;

    const spd = Math.sqrt(current.vx**2+current.vy**2);
    if(spd>8){ current.vx=current.vx/spd*8; current.vy=current.vy/spd*8; }

    current.x += current.vx;
    current.y += current.vy;
    current.age++;

    const hs = current.size/2;
    // Walls
    if(current.x < hs){ current.x=hs; current.vx*=-.4; }
    if(current.x > W-hs){ current.x=W-hs; current.vx*=-.4; }
    // Ceiling
    if(ny<0 && current.y < hs){ current.y=hs; current.vy*=-.4; }

    checkLanding();
  }

  function findLandingY(){
    // Find highest surface directly below current block in same column
    let landY = H - CELL - current.size/2; // land on floor
    for(const b of blocks){
      if(b.col !== current.col) continue;
      const topY = b.y - b.size/2; // world Y of top surface
      if(topY < landY) landY = topY;
    }
    return landY - current.size/2; // return center Y
  }

  function checkLanding(){
    if(!current || current.settled) return;
    const spd = Math.sqrt(current.vx**2+current.vy**2);
    if(spd < .5) return;

    const gx=gravity.x, gy=gravity.y;
    const gl=Math.sqrt(gx*gx+gy*gy);
    const nx=gx/gl, ny=gy/gl;
    const hs = current.size/2;

    if(ny > 0){
      // Falling down
      const landY = findLandingY();
      if(current.y >= landY - hs*.2){
        settleBlock(landY);
        return;
      }
    }

    // Horizontal collision with placed blocks
    if(nx !== 0){
      for(const b of blocks){
        if(Math.abs(b.x-current.x) > CELL*1.5) continue;
        if(Math.abs(b.y-current.y) > hs+b.size/2) continue;
        const ov = (hs+b.size/2) - Math.abs(current.x-b.x);
        if(ov>0 && ((nx>0 && current.x>b.x)||(nx<0 && current.x<b.x))){
          current.x = nx>0 ? b.x-b.size/2-hs : b.x+b.size/2+hs;
          current.vx *= -.3;
          return;
        }
      }
    }

    // Vertical collision
    if(ny !== 0){
      for(const b of blocks){
        if(Math.abs(b.x-current.x) > hs+b.size/2) continue;
        const dot = (current.x-b.x)*nx+(current.y-b.y)*ny;
        if(dot>=0) continue;
        const perp = Math.abs(-nx*(current.y-b.y)+ny*(current.x-b.x));
        if(perp > hs+b.size/2) continue;
        if(dot > -(hs+b.size/2)*2){
          if(ny<0){ current.y=b.y+b.size/2+hs; current.vy*=-.3; }
          else { current.y=b.y-b.size/2-hs; current.vy*=-.3; }
          return;
        }
      }
    }
  }

  function settleBlock(worldY){
    if(!current) return;

    // Snap to column
    const col = Math.max(0, Math.min(COLS-1, Math.round((current.x-CELL/2)/CELL)));
    current.x = col*CELL + CELL/2;
    current.y = worldY;
    current.col = col;
    current.settled = true;
    current.vx = 0; current.vy = 0;

    // Score
    let matched = 0;
    for(const b of blocks){
      if(b.color===current.color){
        const d = Math.sqrt((b.x-current.x)**2+(b.y-current.y)**2);
        if(d < CELL*1.6) matched++;
      }
    }
    if(matched>0){
      combo++;
      const pts = combo>=3?30:(combo>=2?20:10);
      score += pts;
      spawnParticles(current.x, current.y, current.color, 12);
      popScore(current.x, current.y, pts, combo>=2);
    } else {
      combo = 0; score += 5;
      spawnParticles(current.x, current.y, current.color, 6);
    }

    // Scroll camera up to keep top of stack visible
    const topWorldY = current.y - current.size/2;
    // Camera should keep top visible near top of screen
    targetCamY = topWorldY - CELL * 1.5;
    if(targetCamY > camY) targetCamY = camY; // don't scroll down

    blocks.push(current);
    scoreEl.textContent = score;
    current = null;
    combo = 0;

    // Game over: if any block scrolled off bottom
    for(const b of blocks){
      if(b.y - b.size/2 > camY + H + CELL){
        endGame(); return;
      }
    }

    spawnBlock();
  }

  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += .12;
      p.life -= .025;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function gameLoop(){
    if(gameOver) return;
    ctx.clearRect(0,0,W,H);
    drawBg();

    // Smooth camera
    camY += (targetCamY - camY)*.08;

    drawFloor();
    drawParticles();
    for(const b of blocks) drawBlock(b);
    drawCurrent();
    drawArrow();

    applyGravity();
    updateParticles();

    diffTimer++;
    if(diffTimer%600===0) level++;

    requestAnimationFrame(gameLoop);
  }

  function setGravity(dir){
    const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    if(m[dir]) gravity=m[dir];
  }

  document.addEventListener('keydown', e=>{
    if(!running) return;
    if(e.key==='ArrowLeft'||e.key==='a') setGravity('left');
    if(e.key==='ArrowRight'||e.key==='d') setGravity('right');
    if(e.key==='ArrowUp'||e.key==='w') setGravity('up');
    if(e.key==='ArrowDown'||e.key==='s') setGravity('down');
  });

  let tx=0, ty=0;
  canvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY;
  },{passive:false});
  canvas.addEventListener('touchend', e=>{
    e.preventDefault();
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
    if(Math.abs(dx)>Math.abs(dy)) setGravity(dx>0?'right':'left');
    else setGravity(dy>0?'down':'up');
  },{passive:false});

  function startGame(){
    score=0; combo=0; gameOver=false; blocks=[]; particles=[];
    gravity={x:0,y:1}; camY=0; targetCamY=0; level=1; diffTimer=0;
    scoreEl.textContent='0';
    bestEl.textContent=localStorage.getItem('sfBest')||'0';
    overlay.style.display='none';
    running=true;
    spawnBlock();
    gameLoop();
  }

  function endGame(){
    gameOver=true; running=false;
    const best=parseInt(localStorage.getItem('sfBest')||'0');
    if(score>best) localStorage.setItem('sfBest',score);
    setTimeout(()=>{
      overlay.innerHTML='<h1>游戏结束</h1>'+
        '<div style="font-size:60px;color:#ffd700;font-weight:900;margin:8px 0 20px">'+score+'</div>'+
        '<p>最高纪录：'+Math.max(score,best)+'</p>'+
        '<button class="btn btn-primary" id="reBtn">再来一次</button>';
      overlay.style.display='flex';
      document.getElementById('reBtn').onclick=startGame;
    },400);
  }

  document.getElementById('startBtn').onclick=startGame;
  bestEl.textContent=localStorage.getItem('sfBest')||'0';
})();
</script>
</body>
</html>
