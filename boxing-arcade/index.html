<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拳王争霸 ARCADE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  background: #0a0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Impact', 'Arial Black', sans-serif;
  overflow: hidden;
  user-select: none;
  touch-action: none;
}
canvas {
  border-radius: 10px;
  box-shadow: 0 0 40px rgba(255,80,0,0.4);
  display: block;
  max-width: 100vw;
  max-height: 60vh;
}
#ui {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 160px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  pointer-events: none;
}
#left-zone {
  width: 130px; height: 130px;
  position: relative;
  pointer-events: all;
}
#joystick-base {
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.1);
  border: 3px solid rgba(255,255,255,0.25);
  border-radius: 50%;
  position: absolute;
  top: 5px; left: 5px;
  display: flex; align-items: center; justify-content: center;
}
#joystick-knob {
  width: 50px; height: 50px;
  background: rgba(255,200,50,0.7);
  border: 3px solid #FFD700;
  border-radius: 50%;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  transition: none;
}
#right-zone {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
  pointer-events: all;
}
.btn-row {
  display: flex;
  gap: 10px;
}
.ctrl-btn {
  width: 70px; height: 55px;
  border-radius: 14px;
  border: none;
  font-family: 'Impact', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.1;
  letter-spacing: 0.5px;
  transition: transform 0.05s, box-shadow 0.05s;
  -webkit-user-select: none;
}
.ctrl-btn:active, .ctrl-btn.active {
  transform: scale(0.92);
}
#btn-punch {
  background: linear-gradient(180deg,#ff6600,#cc3300);
  box-shadow: 0 4px 0 #8B0000, 0 0 15px rgba(255,80,0,0.5);
  width: 80px; height: 60px; font-size: 15px;
}
#btn-block {
  background: linear-gradient(180deg,#4488ff,#2244cc);
  box-shadow: 0 4px 0 #112288;
}
#btn-dodge {
  background: linear-gradient(180deg,#44bb44,#228822);
  box-shadow: 0 4px 0 #114411;
}
.info {
  color: #666;
  font-size: 12px;
  margin-top: 6px;
  text-align: center;
  letter-spacing: 1px;
  padding-bottom: 170px;
}
.info span { color: #FFD700; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="left-zone">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>
  <div id="right-zone">
    <div class="btn-row">
      <button class="ctrl-btn" id="btn-punch">👊<br>出拳</button>
    </div>
    <div class="btn-row">
      <button class="ctrl-btn" id="btn-block">🛡️<br>防御</button>
      <button class="ctrl-btn" id="btn-dodge">💨<br>闪避</button>
    </div>
  </div>
</div>
<div class="info">🎮 触屏操控 | Touch Controls</div>

<script>
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')

// Auto-size canvas
function resize() {
  const maxW = Math.min(window.innerWidth, 800)
  const maxH = Math.min(window.innerHeight * 0.58, 500)
  const ratio = 800 / 500
  let w = maxW, h = w / ratio
  if (h > maxH) { h = maxH; w = h * ratio }
  canvas.style.width = w + 'px'
  canvas.style.height = h + 'px'
  canvas.width = 800
  canvas.height = 500
}
resize()
window.addEventListener('resize', resize)

const W = 800, H = 500
const GY = 360

// ---------- KEYS (supports keyboard + touch) ----------
const KEYS = {}
const TOUCH = { left: false, right: false, punch: false, block: false, dodge: false }

window.addEventListener('keydown', e => { KEYS[e.key.toLowerCase()] = true })
window.addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false })

// ---------- VIRTUAL JOYSTICK ----------
const joystickBase = document.getElementById('joystick-base')
const joystickKnob = document.getElementById('joystick-knob')
let joystickActive = false
let joystickStartX = 0, joystickStartY = 0
const JOY_MAX = 35

joystickBase.addEventListener('touchstart', e => {
  e.preventDefault()
  joystickActive = true
  const t = e.changedTouches[0]
  const rect = joystickBase.getBoundingClientRect()
  joystickStartX = rect.left + rect.width / 2
  joystickStartY = rect.top + rect.height / 2
}, { passive: false })

joystickBase.addEventListener('touchmove', e => {
  e.preventDefault()
  if (!joystickActive) return
  const t = e.changedTouches[0]
  let dx = t.clientX - joystickStartX
  let dy = t.clientY - joystickStartY
  const dist = Math.sqrt(dx*dx + dy*dy)
  if (dist > JOY_MAX) { dx = dx/dist*JOY_MAX; dy = dy/dist*JOY_MAX }
  joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`
  TOUCH.left = dx < -10
  TOUCH.right = dx > 10
}, { passive: false })

function resetJoystick() {
  joystickActive = false
  joystickKnob.style.transform = 'translate(-50%, -50%)'
  TOUCH.left = false; TOUCH.right = false
}
joystickBase.addEventListener('touchend', e => { e.preventDefault(); resetJoystick() })
joystickBase.addEventListener('touchcancel', e => { e.preventDefault(); resetJoystick() })

// ---------- CONTROL BUTTONS ----------
function bindBtn(id, key) {
  const btn = document.getElementById(id)
  const down = () => { TOUCH[key] = true; btn.classList.add('active') }
  const up = () => { TOUCH[key] = false; btn.classList.remove('active') }
  btn.addEventListener('touchstart', e => { e.preventDefault(); down() }, { passive: false })
  btn.addEventListener('touchend', e => { e.preventDefault(); up() }, { passive: false })
  btn.addEventListener('touchcancel', e => { e.preventDefault(); up() }, { passive: false })
  btn.addEventListener('mousedown', down)
  btn.addEventListener('mouseup', up)
  btn.addEventListener('mouseleave', up)
}
bindBtn('btn-punch', 'punch')
bindBtn('btn-block', 'block')
bindBtn('btn-dodge', 'dodge')

// ---------- STARS ----------
const stars = Array.from({length: 120}, () => ({
  x: Math.random()*W, y: Math.random()*H*0.4,
  r: Math.random()*1.5+0.5, phase: Math.random()*Math.PI*2
}))

// ---------- PLAYER ----------
let P = {
  x: 200, y: GY, hp: 100, maxHp: 100, en: 100, maxEn: 100,
  state: 'idle', st: 0, combo: 0, score: 0, flip: false,
  color: '#1a6cf0', shortColor: '#1a4ad0', name: 'PLAYER'
}

// ---------- CPU ----------
let C = {
  x: 580, y: GY, hp: 100, maxHp: 100, en: 100, maxEn: 100,
  state: 'idle', st: 0, combo: 0, score: 0, flip: true,
  color: '#cc1111', shortColor: '#aa0000', name: 'CPU'
}

// ---------- GAME ----------
let G = {
  phase: 'menu',
  cnt: 3, cntTimer: 0,
  msg: '', msgT: 0,
  shakeX: 0, shakeY: 0,
  time: 0, round: 1,
  spark: []
}

let lastTs = 0
function loop(ts) {
  const dt = Math.min(ts - lastTs, 32)
  lastTs = ts
  G.time = ts
  update(dt)
  draw()
  requestAnimationFrame(loop)
}

// ---------- HELPERS ----------
function addSpark(x, y, n, cols) {
  for (let i = 0; i < n; i++) {
    G.spark.push({
      x, y,
      vx: (Math.random()-0.5)*10,
      vy: (Math.random()-0.5)*10-2,
      life: 25+Math.random()*15,
      max: 40,
      color: cols[Math.floor(Math.random()*cols.length)],
      size: Math.random()*6+2
    })
  }
}

function shake() {
  G.shakeX = (Math.random()-0.5)*10
  G.shakeY = (Math.random()-0.5)*5
}

// ---------- UPDATE ----------
function update(dt) {
  for (let i = G.spark.length-1; i >= 0; i--) {
    const s = G.spark[i]
    s.x += s.vx; s.y += s.vy; s.vy += 0.25; s.life--
    if (s.life <= 0) G.spark.splice(i,1)
  }
  G.shakeX *= 0.85; G.shakeY *= 0.85

  if (G.phase === 'menu') {
    if (Object.keys(KEYS).some(k => KEYS[k]) || TOUCH.punch || G.cntTimer > 0) {
      startGame()
    }
    return
  }

  if (G.phase === 'countdown') {
    G.cntTimer += dt
    if (G.cntTimer > 1000) { G.cntTimer = 0; G.cnt-- }
    if (G.cnt < 0) { G.phase = 'fight' }
    return
  }

  if (G.phase === 'gameover') {
    if (Object.keys(KEYS).some(k => KEYS[k]) || TOUCH.punch) {
      G.phase = 'menu'; resetAll()
    }
    return
  }

  if (G.phase === 'ko') {
    if (G.msgT > 0) G.msgT--
    if (G.msgT === 0) {
      if (P.hp <= 0) { C.score++; G.msg = 'CPU WINS!'; G.pWins = C.score }
      else { P.score++; G.msg = 'YOU WIN!'; G.cWins = P.score }
      G.msgT = 90
      if (P.score >= 3 || C.score >= 3) {
        G.phase = 'gameover'
        G.msg = P.score >= 3 ? '🏆 冠军是你！🏆' : '💀 CPU 冠军 💀'
      } else {
        G.round++
        resetRound()
      }
    }
  }

  if (G.phase !== 'fight' && G.phase !== 'ko') return

  P.en = Math.min(P.maxEn, P.en + 0.18)
  C.en = Math.min(C.maxEn, C.en + 0.14)

  playerInput()
  cpuAI()

  if (P.st > 0) { P.st--; if (P.st===0 && P.state!=='idle' && P.state!=='ko') P.state='idle' }
  if (C.st > 0) { C.st--; if (C.st===0 && C.state!=='idle' && C.state!=='ko') C.state='idle' }

  checkHit(P, C, true)
  checkHit(C, P, false)

  if (P.hp <= 0) { P.state='ko'; C.state='victory'; G.phase='ko'; G.msgT=90; G.msg='K.O.!' }
  if (C.hp <= 0) { C.state='ko'; P.state='victory'; G.phase='ko'; G.msgT=90; G.msg='K.O.!' }

  P.x = Math.max(80, Math.min(W-80, P.x))
  C.x = Math.max(80, Math.min(W-80, C.x))
}

function isLeft()  { return KEYS['a'] || KEYS['arrowleft'] || TOUCH.left }
function isRight() { return KEYS['d'] || KEYS['arrowright'] || TOUCH.right }
function isPunch() { return KEYS['j'] || KEYS[' '] || TOUCH.punch }
function isBlock() { return KEYS['k'] || KEYS['shift'] || TOUCH.block }
function isDodge() { return TOUCH.dodge }

function playerInput() {
  if (P.state==='ko'||P.state==='victory') return
  if (P.st > 0 && P.state!=='block') return

  if (P.state==='idle'||P.state==='block') {
    if (isLeft())  P.x -= 6
    if (isRight()) P.x += 6
    if (isBlock()) { P.state='block'; P.st=999; return }
    if (P.state==='block') { P.state='idle'; P.st=0 }
    if (isPunch() && P.en >= 10) {
      P.state='punch'; P.st=14; P.en-=10
      KEYS['j']=false; KEYS[' ']=false; TOUCH.punch=false
    }
    if (isDodge() && P.st === 0) {
      P.x += (P.x < W/2 ? -65 : 65)
      P.x = Math.max(80, Math.min(W-80, P.x))
      TOUCH.dodge = false
    }
  }
}

function cpuAI() {
  if (C.state==='ko'||C.state==='victory') return
  if (C.st > 0 && C.state!=='block') return
  const dist = Math.abs(P.x - C.x)
  const t = G.time * 0.001
  if (dist > 160) C.x += (P.x > C.x ? 1 : -1) * 2
  else if (dist < 100 && Math.sin(t*3+C.x)>0.4) C.x += (P.x>C.x?-1:1)*1.5
  if (C.state==='idle'||C.state==='block') {
    const r = Math.sin(t*2.5+C.x*0.01)
    if (dist < 200 && r > 0.72 && C.en >= 10) {
      C.state='punch'; C.st=16; C.en-=10
    } else if (r < -0.5 && Math.random()>0.97) {
      C.state='block'; C.st=25
    }
  }
}

function checkHit(atk, def, isPlayer) {
  const punchFrame = isPlayer ? 7 : 8
  if (atk.state!=='punch' || atk.st!==punchFrame) return
  const dist = Math.abs(def.x - atk.x)
  if (dist > 130) return
  if (def.state==='block') {
    def.en = Math.max(0, def.en-6)
    addSpark(def.x+(isPlayer?-1:1)*25, def.y-10, 6, ['#888','#aaa'])
    return
  }
  const dmg = 7 + atk.combo
  def.hp = Math.max(0, def.hp - dmg)
  def.state = 'hurt'; def.st = 14
  atk.combo++
  shake()
  addSpark(def.x+(isPlayer?-1:1)*20, def.y-25, 14, ['#ff4400','#FFD700','#ff6600','#fff'])
}

function startGame() {
  resetAll()
  G.phase = 'countdown'; G.cnt = 3; G.cntTimer = 0
}

function resetAll() {
  P.score=0; C.score=0; G.round=1
  resetRound()
}

function resetRound() {
  P.x=200; P.y=GY; P.hp=P.maxHp; P.en=P.maxEn; P.state='idle'; P.st=0; P.combo=0
  C.x=580; C.y=GY; C.hp=C.maxHp; C.en=C.maxEn; C.state='idle'; C.st=0; C.combo=0
  G.spark=[]
  G.phase='countdown'; G.cnt=3; G.cntTimer=0
}

// ---------- DRAW ----------
function draw() {
  ctx.save()
  ctx.translate(G.shakeX, G.shakeY)
  if (G.phase==='menu') { drawMenu(); ctx.restore(); return }
  drawBg(); drawRing(); drawSpark(); drawFighter(C); drawFighter(P); drawHUD(); drawMsg()
  if (G.phase==='countdown') drawCountdown()
  ctx.restore()
}

function drawBg() {
  const bg = ctx.createLinearGradient(0,0,0,H)
  bg.addColorStop(0,'#0a0015'); bg.addColorStop(0.5,'#1a0030'); bg.addColorStop(1,'#0a0a20')
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H)
  stars.forEach(s => {
    const a = 0.4+Math.sin(G.time*0.001+s.phase)*0.4
    ctx.globalAlpha=a; ctx.fillStyle='#fff'
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill()
  })
  ctx.globalAlpha=1
  ctx.fillStyle='rgba(30,10,5,0.9)'; ctx.fillRect(0,40,W,60)
  for (let i=0; i<W; i+=18) {
    const hh=20+Math.sin(i*0.3+G.time*0.001)*5
    ctx.fillStyle=`hsl(${15+Math.sin(i)*10},40%,${15+hh}%)`
    ctx.beginPath(); ctx.arc(i+9,100-hh*0.5,hh,0,Math.PI*2); ctx.fill()
  }
  const fl=ctx.createLinearGradient(0,GY+80,0,H)
  fl.addColorStop(0,'#3d2010'); fl.addColorStop(1,'#1a0d05')
  ctx.fillStyle=fl; ctx.fillRect(0,GY+80,W,H-GY-80)
  ctx.fillStyle='#8B2020'; ctx.fillRect(60,GY+78,W-120,14)
}

function drawRing() {
  for (let i=0; i<3; i++) {
    const yy=90+i*32
    ctx.strokeStyle='#8B4513'; ctx.lineWidth=5
    ctx.beginPath(); ctx.moveTo(30,yy); ctx.quadraticCurveTo(W/2,yy+18,W-30,yy); ctx.stroke()
  }
  ctx.fillStyle='#6B3A0A'; ctx.fillRect(22,50,16,320); ctx.fillRect(W-38,50,16,320)
  ctx.beginPath(); ctx.moveTo(22,50); ctx.lineTo(38,25); ctx.lineTo(W-38,25); ctx.lineTo(W-22,50)
  ctx.fillStyle='#8B0000'; ctx.fill()
  ctx.fillStyle='#fff'; ctx.font='bold 14px Impact'; ctx.textAlign='center'
  ctx.fillText('★ BOXING CHAMPION ★', W/2, 38)
}

function drawFighter(f) {
  const {x,y,state,color,shortColor,flip}=f
  const bob=state==='idle'?Math.sin(G.time*0.005)*3:0
  const tx=x, ty=y+bob
  ctx.save(); ctx.translate(tx,ty); ctx.scale(flip,1)
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,112,42,13,0,0,Math.PI*2); ctx.fill()
  if (state==='hurt') ctx.translate(Math.sin(G.time*0.5)*4,0)
  if (state==='block') ctx.translate(-8,0)
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(-16,62,13,48); ctx.fillRect(3,62,13,48)
  ctx.fillStyle='#444'; ctx.fillRect(-18,102,17,11); ctx.fillRect(1,102,17,11)
  const bg2=ctx.createLinearGradient(-28,0,28,0)
  bg2.addColorStop(0,color); bg2.addColorStop(1,shortColor)
  ctx.fillStyle=bg2; ctx.fillRect(-28,-8,56,72)
  ctx.fillStyle='#fff'; ctx.fillRect(-28,44,56,10)
  ctx.fillStyle=color; ctx.fillRect(-28,52,56,22)
  ctx.fillStyle='#f5c5a0'
  ctx.save(); ctx.translate(-22,6); ctx.rotate(-0.3+(state==='block'?0.4:0))
  ctx.fillRect(-6,-4,13,38); ctx.fillStyle='#cc2222'; ctx.beginPath(); ctx.arc(0.5,39,12,0,Math.PI*2); ctx.fill()
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(-3,35,4,0,Math.PI*2); ctx.fill(); ctx.restore()
  const pExt=state==='punch'?45:0
  ctx.fillStyle='#f5c5a0'
  ctx.save(); ctx.translate(22,6); ctx.rotate(0.3-pExt*0.015)
  if(state==='punch') ctx.translate(pExt,-5)
  ctx.fillRect(-6,-4,13,38); ctx.fillStyle='#cc2222'; ctx.beginPath(); ctx.arc(0.5,39,12,0,Math.PI*2); ctx.fill()
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(-3,35,4,0,Math.PI*2); ctx.fill(); ctx.restore()
  const hb=state==='punch'?-5:0
  ctx.fillStyle='#f5c5a0'; ctx.beginPath(); ctx.ellipse(0,-30+hb,24,28,0,0,Math.PI*2); ctx.fill()
  ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.ellipse(0,-50+hb,22,14,0,0,Math.PI); ctx.fill()
  if(state!=='ko'){
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.ellipse(-9,-33+hb,4,5,0,0,Math.PI*2); ctx.ellipse(9,-33+hb,4,5,0,0,Math.PI*2); ctx.fill()
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-7,-34+hb,2,0,Math.PI*2); ctx.arc(11,-34+hb,2,0,Math.PI*2); ctx.fill()
    ctx.fillStyle='#c07060'; ctx.beginPath(); ctx.ellipse(0,-18+hb,7,3,0,0,Math.PI*2); ctx.fill()
  }
  if(state==='ko'){
    ctx.strokeStyle='#8B0000'; ctx.lineWidth=3
    ctx.beginPath(); ctx.moveTo(-14,-38); ctx.lineTo(-4,-28); ctx.moveTo(-4,-38); ctx.lineTo(-14,-28)
    ctx.moveTo(4,-38); ctx.lineTo(14,-28); ctx.moveTo(14,-38); ctx.lineTo(4,-28); ctx.stroke()
    ctx.fillStyle='#333'; ctx.beginPath(); ctx.ellipse(0,-16,9,6,0,0,Math.PI*2); ctx.fill()
  }
  if(state==='victory'){
    ctx.fillStyle='#FFD700'; ctx.font='bold 14px Impact'; ctx.textAlign='center'
    ctx.fillText('★ WIN ★',0,-82)
  }
  ctx.restore()
}

function drawSpark() {
  G.spark.forEach(s => {
    const a=s.life/s.max; ctx.globalAlpha=a; ctx.fillStyle=s.color
    ctx.beginPath(); ctx.arc(s.x,s.y,s.size*a,0,Math.PI*2); ctx.fill()
  })
  ctx.globalAlpha=1
}

function drawHUD() {
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,52)
  drawHP(18,10,260,16,P.hp,P.maxHp,'#00cc44','#004400',P.name)
  drawMP(18,30,260,9,P.en,P.maxEn,'#00BFFF','#001840')
  drawHP(W-278,10,260,16,C.hp,C.maxHp,'#cc2222','#440000',C.name)
  drawMP(W-278,30,260,9,C.en,C.maxEn,'#00BFFF','#001840')
  ctx.fillStyle='#FFD700'; ctx.font='bold 18px Impact'; ctx.textAlign='center'
  ctx.fillText(`ROUND ${G.round}`, W/2, 18)
  ctx.fillStyle='#fff'; ctx.font='14px Impact'
  ctx.fillText(`WIN  ${P.score} - ${C.score}`, W/2, 38)
  if(P.combo>1){ctx.fillStyle=`hsl(${Math.min(P.combo*15,30)},100%,55%)`;ctx.font=`bold ${16+P.combo}px Impact`;ctx.textAlign='left';ctx.fillText(`${P.combo} COMBO!`,20,H-20)}
  if(C.combo>1){ctx.fillStyle=`hsl(${Math.min(C.combo*15,30)},100%,55%)`;ctx.font=`bold ${16+C.combo}px Impact`;ctx.textAlign='right';ctx.fillText(`${C.combo} COMBO!`,W-20,H-20)}
}

function drawHP(x,y,w,h,val,max,c1,c2,name){
  const r=Math.max(0,val/max)
  ctx.fillStyle='#111'; ctx.fillRect(x,y,w,h)
  const g=ctx.createLinearGradient(x,y,x+w*r,y)
  g.addColorStop(0,c1); g.addColorStop(1,c2); ctx.fillStyle=g; ctx.fillRect(x+2,y+2,(w-4)*r,h-4)
  ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h)
  ctx.fillStyle='#fff'; ctx.font='bold 12px Impact'; ctx.textAlign='left'; ctx.fillText(name,x,y-4)

    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
</html>
